[package]
name = "krymux-tunnel"
version = "0.1.0"
edition = "2021"
description = "Krymux tunnel operations CLI — keygen, fingerprint, probe, server, client (with SOCKS5 / HTTP proxy frontends)"
license = "MIT"

[dependencies]
krymux = { path = "../../crates/krymux" }
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
env_logger = { version = "0.11", default-features = false }
