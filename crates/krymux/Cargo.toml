[package]
name = "krymux"
version = "0.1.0"
edition = "2021"
description = "Krymux SDK — encrypted, compressed, multiplexed reverse-tunnel protocol library (wire-compatible with the Node reference implementation)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
ring = "0.17"
flate2 = "1"
brotli = "7"
hex = "0.4"
anyhow = "1"
log = "0.4"

[dev-dependencies]
env_logger = { version = "0.11", default-features = false }

[features]
default = []
pq = ["rustls/aws-lc-rs", "tokio-rustls/aws-lc-rs", "dep:aws-lc-rs"]
zstd = ["dep:zstd"]

[dependencies.zstd]
version = "0.13"
optional = true

[dependencies.aws-lc-rs]
version = "1"
optional = true
